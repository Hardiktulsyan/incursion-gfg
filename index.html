<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>INCURSION: MULTIVERSE UNDER SIEGE</title>
  <meta name="description" content="A 36-hour interdimensional hackathon by the GeeksForGeeks Student Chapter at Bennett University. Choose your sector. Build the impossible.">
  <meta name="theme-color" content="#07110e">
  <meta property="og:title" content="INCURSION: MULTIVERSE UNDER SIEGE">
  <meta property="og:description" content="The multiverse is unstable. Your team is the containment protocol.">
  <meta property="og:type" content="website">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Instrument+Serif:ital@0;1&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    :root {
      --void: #07110e;
      --void-2: #0c1915;
      --ink: #dfe7d8;
      --soft: #aab5a6;
      --acid: #b7ff3c;
      --acid-dark: #54791d;
      --line: rgba(183,255,60,.25);
      --rust: #c97c47;
      --violet: #8b85c9;
      --panel: rgba(14,29,23,.82);
      --panel-strong: #12241c;
      --shadow: 0 24px 80px rgba(0,0,0,.32);
      --display: "Bricolage Grotesque", sans-serif;
      --serif: "Instrument Serif", serif;
      --mono: "Space Mono", monospace;
    }

    :root[data-theme="light"] {
      --void: #dce4d5;
      --void-2: #cfd9c9;
      --ink: #10221b;
      --soft: #52675b;
      --acid: #477a0c;
      --acid-dark: #9ac46e;
      --line: rgba(16,34,27,.24);
      --rust: #985129;
      --violet: #5d5796;
      --panel: rgba(230,236,224,.86);
      --panel-strong: #e7eee1;
      --shadow: 0 24px 80px rgba(39,68,50,.15);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; background: var(--void); }
    body {
      margin: 0;
      background: var(--void);
      color: var(--ink);
      font-family: var(--display);
      overflow-x: hidden;
      cursor: default;
      transition: background .35s ease, color .35s ease;
    }

    body::before {
      content: "";
      position: fixed;
      z-index: 20;
      inset: 0;
      pointer-events: none;
      opacity: .08;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.34'/%3E%3C/svg%3E");
      mix-blend-mode: soft-light;
    }

    a { color: inherit; text-decoration: none; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 2px solid var(--acid); outline-offset: 4px; }
    ::selection { color: var(--void); background: var(--acid); }

    .mono { font-family: var(--mono); }
    .serif { font-family: var(--serif); }
    .eyebrow {
      font: 700 10px/1.2 var(--mono);
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--acid);
    }
    .container { width: min(1180px, calc(100% - 48px)); margin: 0 auto; }
    .section { position: relative; padding: 150px 0; }
    .section-title {
      max-width: 720px;
      margin: 16px 0 0;
      font-size: clamp(2.7rem, 6.3vw, 6.6rem);
      line-height: .91;
      letter-spacing: -.065em;
      font-weight: 700;
    }
    .section-title em {
      color: var(--acid);
      font-family: var(--serif);
      font-weight: 400;
      letter-spacing: -.02em;
    }
    .section-lead {
      max-width: 530px;
      color: var(--soft);
      line-height: 1.7;
      font-size: 16px;
    }
    .reveal {
      opacity: 0;
      transform: translateY(28px);
      transition: opacity .8s ease, transform .8s cubic-bezier(.2,.7,.2,1);
    }
    .reveal.is-visible { opacity: 1; transform: translateY(0); }
    .delay-1 { transition-delay: .1s; }
    .delay-2 { transition-delay: .18s; }
    .delay-3 { transition-delay: .27s; }

    .skip-link {
      position: fixed;
      top: 8px;
      left: 8px;
      z-index: 100;
      padding: 8px 12px;
      background: var(--acid);
      color: var(--void);
      transform: translateY(-150%);
    }
    .skip-link:focus { transform: translateY(0); }

    .startup {
      position: fixed;
      inset: 0;
      z-index: 90;
      display: grid;
      place-items: center;
      background: var(--void);
      transition: opacity .7s ease, visibility .7s;
    }
    .startup.done { opacity: 0; visibility: hidden; pointer-events: none; }
    .startup-inner { width: min(520px, calc(100% - 48px)); }
    .startup-brand {
      display: flex;
      justify-content: space-between;
      color: var(--soft);
      font: 10px var(--mono);
      letter-spacing: .14em;
      text-transform: uppercase;
      margin-bottom: 24px;
    }
    .startup-code {
      font: 700 clamp(2.4rem, 8vw, 5rem)/.9 var(--display);
      letter-spacing: -.08em;
      margin: 0 0 28px;
    }
    .startup-code span { color: var(--acid); }
    .startup-bar {
      height: 2px;
      background: rgba(183,255,60,.16);
      overflow: hidden;
    }
    .startup-bar i {
      display: block;
      height: 100%;
      width: 0;
      background: var(--acid);
      animation: bootbar 2.45s cubic-bezier(.2,.7,.2,1) forwards;
    }
    .startup-status {
      display: flex;
      justify-content: space-between;
      margin-top: 12px;
      color: var(--soft);
      font: 10px var(--mono);
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .startup-skip {
      margin-top: 36px;
      background: transparent;
      border: 1px solid var(--line);
      color: var(--soft);
      padding: 11px 14px;
      font: 10px var(--mono);
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .startup-skip:hover { color: var(--acid); border-color: var(--acid); }
    @keyframes bootbar { to { width: 100%; } }

    .site-nav {
      position: fixed;
      z-index: 50;
      top: 0;
      width: 100%;
      height: 74px;
      display: flex;
      align-items: center;
      background: linear-gradient(180deg, rgba(7,17,14,.92), rgba(7,17,14,0));
      transition: background .3s;
    }
    [data-theme="light"] .site-nav {
      background: linear-gradient(180deg, rgba(220,228,213,.94), rgba(220,228,213,0));
    }
    .nav-inner {
      width: min(1320px, calc(100% - 48px));
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 auto;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font: 700 12px var(--mono);
      letter-spacing: .08em;
    }
    .brand-mark {
      width: 22px;
      height: 22px;
      display: grid;
      place-items: center;
      border: 1px solid var(--acid);
      color: var(--acid);
      transform: rotate(45deg);
    }
    .brand-mark span { transform: rotate(-45deg); font-size: 11px; }
    .nav-links { display: flex; gap: 28px; align-items: center; }
    .nav-links a {
      color: var(--soft);
      font: 10px var(--mono);
      letter-spacing: .11em;
      text-transform: uppercase;
    }
    .nav-links a:hover { color: var(--acid); }
    .nav-actions { display: flex; align-items: center; gap: 9px; }
    .icon-button {
      width: 35px;
      height: 35px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
    }
    .icon-button:hover { border-color: var(--acid); color: var(--acid); }
    .theme-sun { display: none; }
    [data-theme="light"] .theme-moon { display: none; }
    [data-theme="light"] .theme-sun { display: block; }

    .sound-button {
      display: flex;
      align-items: center;
      gap: 8px;
      width: auto;
      padding: 0 10px;
      font: 9px var(--mono);
      letter-spacing: .08em;
    }
    .eq { display: flex; align-items: end; gap: 2px; height: 13px; }
    .eq i { display: block; width: 2px; height: 5px; background: currentColor; }
    .sound-on .eq i:nth-child(1) { animation: eq .65s ease-in-out infinite alternate; }
    .sound-on .eq i:nth-child(2) { animation: eq .5s .12s ease-in-out infinite alternate; }
    .sound-on .eq i:nth-child(3) { animation: eq .8s .2s ease-in-out infinite alternate; }
    @keyframes eq { to { height: 13px; } }

    .hero {
      min-height: 100svh;
      display: grid;
      align-items: end;
      position: relative;
      overflow: hidden;
      border-bottom: 1px solid var(--line);
    }
    #hero-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: .86;
    }
    .hero-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(183,255,60,.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(183,255,60,.055) 1px, transparent 1px);
      background-size: 86px 86px;
      mask-image: linear-gradient(90deg, transparent, #000 30%, #000 75%, transparent);
      transform: perspective(800px) rotateX(62deg) scale(1.6) translateY(15%);
      transform-origin: bottom;
      opacity: .46;
    }
    .hero-vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(
        circle at 71% 43%,
        transparent 0 11%,
        rgba(7,17,14,.2) 33%,
        var(--void) 83%
      );
    }
    .hero-copy {
      position: relative;
      z-index: 2;
      width: min(1320px, calc(100% - 48px));
      margin: auto auto 0;
      padding: 170px 0 76px;
    }
    .hero-kicker {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--acid);
      font: 10px var(--mono);
      letter-spacing: .2em;
      text-transform: uppercase;
    }
    .hero-kicker::before {
      content: "";
      display: block;
      width: 40px;
      height: 1px;
      background: var(--acid);
    }
    .hero h1 {
      max-width: 1000px;
      margin: 20px 0 26px;
      font-size: clamp(4rem, 12.4vw, 12rem);
      line-height: .78;
      letter-spacing: -.095em;
      font-weight: 800;
      text-wrap: balance;
    }
    .hero h1 span { display: block; color: var(--acid); }
    .hero h1 small {
      font-size: .38em;
      letter-spacing: -.04em;
      color: var(--soft);
      vertical-align: .36em;
      margin-left: .12em;
    }
    .hero-bottom {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 32px;
      border-top: 1px solid var(--line);
      padding-top: 19px;
    }
    .hero-intro {
      max-width: 370px;
      color: var(--soft);
      font-size: 15px;
      line-height: 1.55;
      margin: 0;
    }
    .hero-meta {
      display: grid;
      grid-template-columns: repeat(3, auto);
      gap: 26px;
      text-align: right;
    }
    .meta-label {
      display: block;
      color: var(--soft);
      font: 9px var(--mono);
      letter-spacing: .1em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .meta-value { font: 700 13px var(--mono); color: var(--ink); }
    .meta-value strong { color: var(--acid); font-weight: 700; }
    .countdown { display: inline-block; color: var(--acid); font-size: 11px; letter-spacing: .02em; }
    .hero-scroll {
      position: absolute;
      bottom: 31px;
      right: 26px;
      writing-mode: vertical-rl;
      color: var(--soft);
      font: 9px var(--mono);
      letter-spacing: .15em;
      text-transform: uppercase;
    }
    .hero-scroll::after {
      content: "";
      display: inline-block;
      width: 1px;
      height: 38px;
      margin-top: 10px;
      background: var(--acid);
    }
    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      border: 1px solid var(--acid);
      color: var(--void);
      background: var(--acid);
      padding: 15px 19px;
      font: 700 11px var(--mono);
      letter-spacing: .08em;
      text-transform: uppercase;
      transition: transform .25s, background .25s, color .25s;
    }
    .cta:hover { transform: translateY(-3px); background: transparent; color: var(--acid); }
    .cta .arrow { font-size: 17px; line-height: 0; }
    .cta-ghost { background: transparent; color: var(--acid); }

    .signal-strip {
      padding: 18px 0;
      border-bottom: 1px solid var(--line);
      background: rgba(183,255,60,.035);
      overflow: hidden;
    }
    .signal-track {
      display: flex;
      width: max-content;
      animation: marquee 25s linear infinite;
    }
    .signal-item {
      display: flex;
      align-items: center;
      gap: 24px;
      padding: 0 24px;
      color: var(--soft);
      font: 10px var(--mono);
      letter-spacing: .14em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .signal-item b { color: var(--acid); font-size: 14px; }
    @keyframes marquee { to { transform: translateX(-50%); } }

    .briefing { overflow: hidden; }
    .brief-grid {
      display: grid;
      grid-template-columns: 1.05fr .95fr;
      gap: 9vw;
      align-items: end;
    }
    .brief-statement {
      font: 400 clamp(2.2rem, 5vw, 5.4rem)/.97 var(--serif);
      letter-spacing: -.045em;
    }
    .brief-statement i { color: var(--acid); }
    .annotation {
      border-left: 1px solid var(--acid);
      padding-left: 20px;
      margin-top: 42px;
      color: var(--soft);
      font: 12px/1.7 var(--mono);
    }
    .annotation b { color: var(--ink); font-weight: 700; }
    .terminal-card {
      position: relative;
      margin-top: 74px;
      padding: 22px;
      border: 1px solid var(--line);
      background: linear-gradient(130deg, rgba(183,255,60,.06), transparent 50%), var(--panel);
      box-shadow: var(--shadow);
    }
    .terminal-card::before {
      content: "TRANSMISSION 004 / EYES ONLY";
      position: absolute;
      top: -9px;
      left: 17px;
      padding: 0 8px;
      background: var(--void);
      color: var(--acid);
      font: 9px var(--mono);
      letter-spacing: .12em;
    }
    .terminal-top {
      display: flex;
      justify-content: space-between;
      color: var(--soft);
      font: 9px var(--mono);
      padding-bottom: 17px;
      border-bottom: 1px solid var(--line);
    }
    .terminal-body {
      padding: 30px 5px 15px;
      font: 16px/1.65 var(--mono);
      color: var(--ink);
    }
    .terminal-body .cursor {
      display: inline-block;
      width: 8px;
      height: 17px;
      background: var(--acid);
      vertical-align: -2px;
      animation: blink 1s steps(2) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    .axis {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      margin-top: 110px;
      background: var(--line);
    }
    .axis-cell { min-height: 170px; padding: 21px; background: var(--void); }
    .axis-cell b {
      display: block;
      font-size: 34px;
      color: var(--acid);
      letter-spacing: -.06em;
    }
    .axis-cell span {
      color: var(--soft);
      font: 10px var(--mono);
      text-transform: uppercase;
      letter-spacing: .12em;
    }

    .relic-section {
      padding-top: 100px;
      background: radial-gradient(
        circle at 72% 47%,
        rgba(183,255,60,.08),
        transparent 29%
      );
    }
    .relic-grid {
      display: grid;
      grid-template-columns: .84fr 1.16fr;
      gap: 5vw;
      align-items: center;
    }
    .relic-stage {
      position: relative;
      min-height: 590px;
      border: 1px solid var(--line);
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 43%, rgba(183,255,60,.09), transparent 29%),
        rgba(8,19,15,.32);
    }
    #relic-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: grab;
    }
    #relic-canvas:active { cursor: grabbing; }

    .stage-label {
      position: absolute;
      z-index: 2;
      font: 9px var(--mono);
      color: var(--soft);
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .stage-label.top { top: 17px; left: 18px; }
    .stage-label.bottom { right: 18px; bottom: 17px; color: var(--acid); }
    .stage-cross {
      position: absolute;
      z-index: 2;
      left: 50%;
      top: 50%;
      width: 36px;
      height: 36px;
      transform: translate(-50%,-50%);
      opacity: .45;
      pointer-events: none;
    }
    .stage-cross::before, .stage-cross::after {
      content: "";
      position: absolute;
      background: var(--acid);
    }
    .stage-cross::before { width: 100%; height: 1px; top: 18px; }
    .stage-cross::after { width: 1px; height: 100%; left: 18px; }

    .relic-copy .section-title { font-size: clamp(3rem, 6vw, 6.8rem); }
    .relic-list {
      list-style: none;
      padding: 0;
      margin: 38px 0;
      border-top: 1px solid var(--line);
    }
    .relic-list li {
      display: grid;
      grid-template-columns: 32px 1fr;
      gap: 10px;
      padding: 17px 0;
      border-bottom: 1px solid var(--line);
      color: var(--soft);
      font-size: 14px;
      line-height: 1.5;
    }
    .relic-list li::before {
      content: "↳";
      color: var(--acid);
      font-family: var(--mono);
    }

    .timeline-section { overflow: hidden; }
    .timeline-head {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 30px;
      margin-bottom: 70px;
    }
    .timeline-head .section-title { max-width: 620px; }
    .timeline-clock {
      text-align: right;
      color: var(--soft);
      font: 10px/1.6 var(--mono);
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .timeline-clock strong {
      display: block;
      color: var(--acid);
      font-size: 22px;
      letter-spacing: 0;
    }
    .rift-timeline { position: relative; margin-left: 22px; }
    .rift-line {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 1px;
      background: rgba(183,255,60,.17);
    }
    .rift-progress {
      position: absolute;
      left: 0;
      top: 0;
      width: 2px;
      height: var(--timeline-progress, 0%);
      background: var(--acid);
      box-shadow: 0 0 18px rgba(183,255,60,.4);
      transform-origin: top;
    }
    .timeline-item {
      position: relative;
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: 34px;
      padding: 0 0 74px 44px;
    }
    .timeline-dot {
      position: absolute;
      left: -5px;
      top: 3px;
      width: 11px;
      height: 11px;
      border: 1px solid var(--acid);
      background: var(--void);
      transform: rotate(45deg);
    }
    .timeline-item.active .timeline-dot {
      background: var(--acid);
      box-shadow: 0 0 0 6px rgba(183,255,60,.08);
    }
    .timeline-time { color: var(--acid); font: 11px var(--mono); letter-spacing: .08em; }
    .timeline-content h3 { margin: 0 0 10px; font-size: 27px; letter-spacing: -.04em; }
    .timeline-content p {
      margin: 0;
      max-width: 510px;
      color: var(--soft);
      font-size: 14px;
      line-height: 1.6;
    }
    .timeline-tag {
      display: inline-block;
      margin-top: 16px;
      padding: 5px 8px;
      border: 1px solid var(--line);
      color: var(--soft);
      font: 9px var(--mono);
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .sectors { padding-bottom: 170px; }
    .sectors-grid {
      display: grid;
      grid-template-columns: 1.2fr .8fr;
      gap: 2px;
      background: var(--line);
      margin-top: 70px;
    }
    .sector {
      min-height: 235px;
      padding: 27px;
      background: var(--panel);
      position: relative;
      overflow: hidden;
      transition: background .3s, transform .3s;
    }
    .sector:hover {
      background: var(--panel-strong);
      transform: translateY(-5px);
      z-index: 2;
    }
    .sector:nth-child(2), .sector:nth-child(3) { background: rgba(201,124,71,.07); }
    .sector:nth-child(4) { background: rgba(139,133,201,.09); }
    .sector-index { color: var(--acid); font: 10px var(--mono); }
    .sector h3 { margin: 51px 0 9px; font-size: 28px; letter-spacing: -.04em; }
    .sector p {
      margin: 0;
      color: var(--soft);
      font: 13px/1.55 var(--mono);
      max-width: 380px;
    }
    .sector-bounty {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
      margin-top: 24px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      color: var(--soft);
      font: 9px var(--mono);
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .sector-bounty strong { color: var(--acid); font-size: 17px; letter-spacing: -.03em; }
    .sector-line {
      position: absolute;
      right: 25px;
      top: 28px;
      width: 38px;
      height: 38px;

      function useReveal() {
        React.useEffect(function () {
          var nodes = document.querySelectorAll(".reveal");
          if (prefersReduced || !("IntersectionObserver" in window)) {
            nodes.forEach(function (node) { node.classList.add("is-visible"); });
            return;
          }
          var observer = new IntersectionObserver(
            function (entries) {
              entries.forEach(function (entry) {
                if (entry.isIntersecting) {
                  entry.target.classList.add("is-visible");
                  observer.unobserve(entry.target);
                }
              });
            },
            { threshold: .12, rootMargin: "0px 0px -35px" }
          );
          nodes.forEach(function (node) { observer.observe(node); });
          return function () { observer.disconnect(); };
        }, []);
      }

      function useTimeline() {
        React.useEffect(function () {
          var line = document.getElementById("timeline");
          if (!line) return;

          function update() {
            var rect = line.getBoundingClientRect();
            var viewport = window.innerHeight;
            var progress = Math.max(0, Math.min(1, (viewport * .68 - rect.top) / rect.height));

            line.style.setProperty("--timeline-progress", progress * 100 + "%");
            line.querySelectorAll(".timeline-item").forEach(function (item) {
              var itemRect = item.getBoundingClientRect();
              item.classList.toggle(
                "active",
                itemRect.top < viewport * .7 && itemRect.bottom > viewport * .26
              );
            });
          }

          update();
          window.addEventListener("scroll", update, { passive: true });
          window.addEventListener("resize", update);
          return function () {
            window.removeEventListener("scroll", update);
            window.removeEventListener("resize", update);
          };
        }, []);
      }

              socket.rotation.z = sign * 0.08;
              group.add(socket);

              var slit = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.045, 0.15), eyeLaserMat);
              slit.position.set(x, 0.14, 0.74);
              slit.rotation.z = sign * 0.1;
              group.add(slit);

              var cheek = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.52, 0.28), armorSteelMat);
              cheek.position.set(sign * 0.44, -0.12, 0.52);
              cheek.rotation.set(0.1, sign * 0.35, -sign * 0.15);
              group.add(cheek);
            });

            // 5. Mouth Grille & Respirator Bars
            var grille = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.38, 0.32), darkCavity);
            grille.position.set(0, -0.26, 0.6);
            group.add(grille);

            for (var b = -3; b <= 3; b++) {
              var bar = new THREE.Mesh(new THREE.CylinderGeometry(0.016, 0.016, 0.24, 8), armorSteelMat);
              bar.position.set(b * 0.065, -0.26, 0.77);
              group.add(bar);
            }

            var chin = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.18, 0.28), armorSteelMat);
            chin.position.set(0, -0.48, 0.58);
            group.add(chin);

            // 6. Dynamic Cloth Mantle with Real-Time Wind Simulation
            clothGeo = new THREE.PlaneGeometry(1.8, 1.4, 24, 16);
            var clothMesh = new THREE.Mesh(clothGeo, blackishGreenCloth);
            clothMesh.position.set(0, -0.65, -0.45);
            clothMesh.rotation.y = Math.PI;
            group.add(clothMesh);
            initialClothPositions = clothGeo.attributes.position.array.slice();

            // 7. Dynamic Forcefield Energy Shield
            var shieldGeo = new THREE.IcosahedronGeometry(1.75, 1);
            shieldMesh = new THREE.Mesh(shieldGeo, energyShieldMat);
            group.add(shieldMesh);

            shieldRing = new THREE.Mesh(
              new THREE.TorusGeometry(1.82, 0.015, 8, 64),
              new THREE.MeshBasicMaterial({ color: 0x22c55e, wireframe: true })
            );
            shieldRing.rotation.x = Math.PI / 2.6;
            group.add(shieldRing);

            // Drag Interaction Controls
            canvas.addEventListener("mousedown", function (e) {
              isDragging = true;
              prevMouseX = e.clientX;
            });
            window.addEventListener("mousemove", function (e) {
              if (!isDragging) return;
              targetRotY += (e.clientX - prevMouseX) * 0.0075;
              prevMouseX = e.clientX;
            });
            window.addEventListener("mouseup", function () { isDragging = false; });

            canvas.addEventListener("touchstart", function (e) {
              if (e.touches.length === 1) {
                isDragging = true;
                prevMouseX = e.touches[0].clientX;
              }
            }, { passive: true });
            window.addEventListener("touchmove", function (e) {
              if (isDragging && e.touches.length === 1) {
                targetRotY += (e.touches[0].clientX - prevMouseX) * 0.008;
                prevMouseX = e.touches[0].clientX;
              }
            }, { passive: true });
            window.addEventListener("touchend", function () { isDragging = false; });
          } else {
            // Hero Multiverse Starfield Background
            var stars = new THREE.Group();
            for (var s = 0; s < 45; s++) {
              var dot = new THREE.Mesh(
                new THREE.SphereGeometry(0.014 + Math.random() * 0.02, 5, 5),
                new THREE.MeshBasicMaterial({
                  color: s % 3 ? 0xa4bb9e : 0xb7ff3c
                })
              );
              dot.position.set(
                (Math.random() - 0.5) * 6,
                (Math.random() - 0.5) * 4,
                (Math.random() - 0.5) * 2.5
              );
              stars.add(dot);
            }
            scene.add(stars);
          }

          function resize() {
            var width = host.clientWidth;
            var height = host.clientHeight;
            renderer.setSize(width, height, false);
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
          }

          resize();
          window.addEventListener("resize", resize);

          var start = performance.now();
          var frame;

          function animate(now) {
            var time = (now - start) / 1000;

            if (relic) {
              if (!isDragging) {
                targetRotY += 0.008;
              }
              group.rotation.y += (targetRotY - group.rotation.y) * 0.08;
              group.position.y = Math.sin(time * 1.5) * 0.05;

              // Wave calculation on cloth mantle
              if (clothGeo && initialClothPositions) {
                var pos = clothGeo.attributes.position;
                for (var i = 0; i < pos.count; i++) {
                  var ix = i * 3;
                  var x = initialClothPositions[ix];
                  var y = initialClothPositions[ix + 1];
                  var weight = Math.max(0, 0.7 - y);
                  var wave1 = Math.sin(x * 3.5 + time * 3.2) * 0.12;
                  var wave2 = Math.cos(y * 4.0 + time * 4.1) * 0.1;
                  var gust = Math.sin(time * 1.6) * 0.08;
                  pos.array[ix + 2] = initialClothPositions[ix + 2] + (wave1 + wave2 + gust) * weight;
                }
                pos.needsUpdate = true;
                clothGeo.computeVertexNormals();
              }

              // Pulse on forcefield shield
              if (shieldMesh && shieldRing) {
                var shieldPulse = 1.0 + Math.sin(time * 3.0) * 0.035;
                shieldMesh.scale.set(shieldPulse, shieldPulse, shieldPulse);
                shieldMesh.rotation.y -= 0.005;
                shieldRing.rotation.z += 0.006;
              }
            } else {
              group.rotation.y = time * 0.03;
            }

            renderer.render(scene, camera);
            frame = requestAnimationFrame(animate);
          }

          frame = requestAnimationFrame(animate);

          return function () {
            cancelAnimationFrame(frame);
            window.removeEventListener("resize", resize);
            renderer.dispose();
          };
        }, [canvasId, relic]);
      }

      function App() {
        var [booted, setBooted] = React.useState(false);
        var [modal, setModal] = React.useState(false);
        var [sound, setSound] = React.useState(function () {
          return localStorage.getItem("incursion-sound") === "on";
        });
        var [theme, setTheme] = React.useState(function () {
          return localStorage.getItem("incursion-theme") || "dark";
        });

        useReveal();
        useTimeline();
        useScene("hero-canvas", false);
        useScene("relic-canvas", true);

        React.useEffect(function () {
          document.documentElement.dataset.theme = theme;
          localStorage.setItem("incursion-theme", theme);
        }, [theme]);

        React.useEffect(function () {
          localStorage.setItem("incursion-sound", sound ? "on" : "off");
          soundEngine.setMuted(!sound);
        }, [sound]);

        React.useEffect(function () {
          var onMove = function (event) {
            var reticle = document.querySelector(".reticle");
            if (reticle && !prefersReduced) {
              reticle.style.left = event.clientX + "px";
              reticle.style.top = event.clientY + "px";
            }
          };
          window.addEventListener("pointermove", onMove, { passive: true });
          return function () { window.removeEventListener("pointermove", onMove); };
        }, []);

        React.useEffect(function () {
          var timer = setTimeout(function () {
            setBooted(true);
          }, 2600);
          return function () { clearTimeout(timer); };
        }, []);

        return h(
          React.Fragment,
          null,
          h(Startup, {
            done: booted,
            onSkip: function () {
              setBooted(true);
              setSound(true);
              soundEngine.setMuted(false);
            }
          }),
          h(Nav, {
            sound: sound,
            onSound: function () {
              var next = !sound;
              setSound(next);
              soundEngine.setMuted(!next);
            },
            onTheme: function () {
              setTheme(theme === "dark" ? "light" : "dark");
            },
            onRegister: function () {
              setModal(true);
            }
          }),
          h(
            "div",
            { className: "reticle", "aria-hidden": "true" },
            h("i"),
            h("b")
          ),
          h(
            "main",
            { id: "main-content" },
            h(Hero),
            h(SignalStrip),
            h(Briefing),
            h(Relic),
            h(Timeline),
            h(Sectors),
            h(FAQ),
            h(Finale, {
              onRegister: function () {
                setModal(true);
              }
            })
          ),
          h(Footer),
          h(RegistrationModal, {
            open: modal,
            onClose: function () {
              setModal(false);
            }
          })
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(h(App));
    }());
  </script>
</body>
</html>
